name: RoosterWeb
options:
  bundleIdPrefix: com.joyeneye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 8G9DC6LL44
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RoosterWeb:
    type: application
    platform: iOS
    sources:
      - path: RoosterWeb
    settings:
      base:
        # Distinct from jwhitedidit-ios (com.jwhitedidit.rooster, "ROOSTER") so both can sit on one phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.joyeneye.rooster-polished
        PRODUCT_NAME: RoosterWeb
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The site the app wraps. Override per build to point at a local server or fixture.
        ROOSTER_BASE_URL: https://rooster-polished.vercel.app
    info:
      path: RoosterWeb/Info.plist
      properties:
        CFBundleDisplayName: ROOSTER Web
        ROOSTERBaseURL: $(ROOSTER_BASE_URL)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: ROOSTER uses your camera when you take a picture, record a clip or go live in a room.
        NSMicrophoneUsageDescription: ROOSTER uses your microphone when you speak in a room or record a clip.
        NSPhotoLibraryUsageDescription: ROOSTER opens your photo library when you choose a picture or video to share.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # The polished layer's faces: Chakra Petch (headings) and Space Mono (labels). SIL OFL.
        UIAppFonts:
          - ChakraPetch-Medium.ttf
          - ChakraPetch-SemiBold.ttf
          - ChakraPetch-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    scheme:
      testTargets:
        - RoosterWebTests

  RoosterWebTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoosterWebTests
    dependencies:
      - target: RoosterWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joyeneye.rooster-polished.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
